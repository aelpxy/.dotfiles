"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = """
$username$hostname${custom.org}$directory$git_branch$git_state$git_status$nodejs$bun$golang$python
$character"""

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[username]
format = "[$user@]($style)"
style_user = "green"
style_root = "bold red"

[hostname]
format = "[$hostname]($style) "
style = "green"

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "red"

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "bright-black"

[git_state]
format = '[\($state( $progress_current/$progress_total)\)]($style) '
style = "bright-black"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "yellow"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
deleted = "✘${count}"
renamed = "»${count}"
stashed = "≡"

[custom.org]
command = 'basename "$(dirname "$(git rev-parse --show-toplevel)")"'
shell = ["sh"]
require_repo = true
when = true
format = "[$output/]($style)"
style = "cyan"

[nodejs]
format = "[$symbol]($style)"
symbol = " "
style = "green"

[bun]
format = "[$symbol]($style)"
symbol = " "
style = "yellow"

[golang]
format = "[$symbol]($style)"
symbol = " "
style = "cyan"

[python]
format = "[$symbol]($style)"
symbol = " "
style = "yellow"
