# ---------- Font ----------
font_family JetBrainsMono Nerd Font Mono
font_size 18.0
modify_font cell_height 112%

# ---------- Window ----------
window_padding_width 10 12
placement_strategy center
inactive_text_alpha 0.85
enabled_layouts splits,stack
tab_bar_edge top
tab_bar_style powerline
# background_opacity 0.9
# background_blur 32

# ---------- Cursor ----------
cursor_shape beam
cursor_blink_interval 0.5
mouse_hide_wait 0.1

# ---------- Behaviour ----------
scrollback_lines 100000
copy_on_select clipboard
confirm_os_window_close 1
shell_integration enabled
remember_window_size no
enable_audio_bell no

# ---------- Keybinds ----------
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_window
map ctrl+shift+n new_os_window_with_cwd
map ctrl+shift+e launch --location=vsplit --cwd=current
map ctrl+shift+o launch --location=hsplit --cwd=current
map ctrl+shift+f toggle_layout stack
map ctrl+page_down next_tab
map ctrl+page_up previous_tab
map ctrl+0 change_font_size all 0

# ---------- Theme (Ayu) ----------
background #0b0e14
foreground #bfbdb6
cursor #e6b450
cursor_text_color #0b0e14
selection_background #409fff
selection_foreground #0b0e14

color0 #11151c
color1 #ea6c73
color2 #7fd962
